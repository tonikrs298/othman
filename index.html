<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Landing Page</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <nav class="nav container">
        <div class="logo">BrandName</div>
        <ul class="nav-links">
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Services</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
        <button class="btn">Get Started</button>
      </nav>
    </header>

    <main class="hero container">
      <div class="hero-text">
        <p class="tag">Modern design • Clean code</p>
        <h1>Build something amazing with us.</h1>
        <p class="subtitle">
          We create simple, elegant digital experiences that help businesses grow.
        </p>
        <div class="hero-actions">
          <button class="btn primary">Learn More</button>
          <button class="btn secondary">View Work</button>
        </div>
      </div>

      <div class="hero-card">
        <div class="card">
          <h3>Growth</h3>
          <p>Strategy, design, and development for modern brands.</p>
          <span>+120%</span>
        </div>
      </div>
    </main>
  </body>
</html>
